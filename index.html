<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comunidad | Santa Fe</title>
    <script>
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74)) || (e.ctrlKey && e.keyCode === 85)) {
                e.preventDefault();
            }
        });
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --comunidad-violeta: #3D1488; --comunidad-fucsia: #EF3C6B; }
        body { font-family: 'Montserrat', sans-serif; background-color: var(--comunidad-violeta); padding: 20px; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { max-width: 480px; width: 100%; background: #FFFFFF; padding: 35px; border-radius: 25px; box-shadow: 0 20px 50px rgba(0,0,0,0.3); }
        .field { margin-bottom: 20px; }
        input, select { width: 100%; padding: 14px; border: 2px solid #e9ecef; border-radius: 12px; font-size: 16px; box-sizing: border-box; }
        .btn-calc { background-color: var(--comunidad-fucsia); color: white; border: none; padding: 16px; width: 100%; border-radius: 12px; font-weight: 800; text-transform: uppercase; cursor: pointer; }
        #placa-resultado { display: none; margin-top: 30px; padding: 40px 20px; border-radius: 20px; text-align: center; background-color: var(--comunidad-violeta); color: white; border: 5px solid var(--comunidad-fucsia); }
    </style>
</head>
<body>

<div class="container">
    <h2>¿Cuánto te queda de tus ingresos?</h2>
    <div class="field">
        <select id="i_1">
            <option value="" disabled selected>Seleccioná tu situación...</option>
            <option value="463174">Jubilación Mínima</option>
            <option value="940586">Ingreso Promedio</option>
            <option value="1063650">Salario Comercio</option>
        </select>
    </div>
    <div class="field">
        <select id="i_2">
            <option value="0">No alquilo</option>
            <option value="430000">1 ambiente</option>
        </select>
    </div>
    <button class="btn-calc" onclick="_c()">calcular</button>

    <div id="placa-resultado">
        <div id="p_1" style="font-size: 3rem; font-weight: 800; color: var(--comunidad-fucsia);"></div>
    </div>
</div>

<script>
    // Lógica ofuscada
    function _c() {
        const _v1 = parseFloat(document.getElementById('i_1').value) || 0;
        const _v2 = parseFloat(document.getElementById('i_2').value) || 0;
        
        // Operación ofuscada para nafta: 2087 * X
        const _n = (x) => x * (2000 + 87); 
        
        const _r = _v1 - _v2;
        
        const _d = document.getElementById('placa-resultado');
        const _m = document.getElementById('p_1');
        
        _d.style.display = 'block';
        _m.innerText = "$" + _r.toLocaleString('es-AR');
    }
</script>
</body>
</html>
